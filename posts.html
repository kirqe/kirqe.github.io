---
layout: default
title: "Posts"
---

<section class="content home-feed posts-feed">
  <ul class="home-collection">
    {% for post in site.posts %}
    {% unless post.draft %}
    <li>
      <a href="{{ post.url }}" class="home-item-title">{{ post.title }}</a>
      <p class="home-item-description home-post-date">{{ post.date | date: "%B %e, %Y" }}</p>
    </li>
    {% endunless %}
    {% endfor %}
  </ul>
</section>
